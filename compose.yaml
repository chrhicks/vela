# Vela on one host. Config and data live in XDG directories on the host and are mounted in:
#   ${VELA_CONFIG_DIR}  default $XDG_CONFIG_HOME/vela  (cria.json, alerts.json)
#   ${VELA_DATA_DIR}    default $XDG_DATA_HOME/vela    (rigs.yaml, saved-images, survey-cache, traces,
#                                                       alignment-diagnostics, astap/, attestation.json)
# There is no login: whoever can reach VELA_PORT can drive the rig. See docs/docker.md.
name: vela

x-config-dir: &config-dir ${VELA_CONFIG_DIR:-${XDG_CONFIG_HOME:-${HOME}/.config}/vela}
x-data-dir: &data-dir ${VELA_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/vela}

services:
  nats:
    image: nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
    user: "${VELA_UID:-1000}:${VELA_GID:-1000}"
    restart: unless-stopped
    command: ["--config", "/etc/nats/server.conf"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - type: bind
        source: ${VELA_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/vela}/nats/server.conf
        target: /etc/nats/server.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VELA_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/vela}/nats
        target: /data
        bind:
          create_host_path: false

  server:
    build:
      context: .
      target: server
    image: vela-server:local
    user: "${VELA_UID:-1000}:${VELA_GID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      NODE_OPTIONS: --conditions=built
      VELA_CRIA_CONFIG_PATH: /config/cria.json
      VELA_ALERTS_CONFIG_PATH: /config/alerts.json
      VELA_RIG_CATALOG_PATH: /data/rigs.yaml
      VELA_SAVED_IMAGES_PATH: /data/saved-images
      VELA_SURVEY_CACHE_PATH: /data/survey-cache
      VELA_TRACE_PATH: /data/traces/observing.jsonl
      VELA_RUN_LOG_DIR: /data/run-log
      VELA_NATS_URL: nats://nats:4222
      VELA_NATS_CREDENTIALS_FILE: /data/nats/credentials.json
      VELA_ALIGNMENT_DIAGNOSTICS_PATH: /data/alignment-diagnostics/trials
      VELA_ASTAP: /astap/astap_cli
      VELA_STAR_CATALOG: /astap/catalog/opt/astap
    volumes:
      - type: bind
        source: *config-dir
        target: /config
        read_only: true
      - type: bind
        source: *data-dir
        target: /data
      - type: bind
        source: ${VELA_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/vela}/astap
        target: /astap
        read_only: true

  archiver:
    build:
      context: .
      target: server
    image: vela-server:local
    user: "${VELA_UID:-1000}:${VELA_GID:-1000}"
    restart: unless-stopped
    command: ["node", "dist/run-log/archiver-main.js"]
    healthcheck:
      disable: true
    environment:
      VELA_NATS_URL: nats://nats:4222
      VELA_NATS_CREDENTIALS_FILE: /credentials.json
      VELA_ARCHIVE_DIR: /mnt/storage/rig/archive
    volumes:
      - type: bind
        source: ${VELA_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/vela}/nats/credentials.json
        target: /credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VELA_ARCHIVE_DIR:-/mnt/storage/rig/archive}
        target: /mnt/storage/rig/archive
        bind:
          create_host_path: false

  solver:
    build:
      context: .
      target: server
    image: vela-server:local
    user: "${VELA_UID:-1000}:${VELA_GID:-1000}"
    restart: unless-stopped
    command: ["node", "dist/plate-solving/shadow-main.js"]
    healthcheck:
      disable: true
    cpus: 1
    mem_limit: 1g
    environment:
      VELA_NATS_URL: nats://nats:4222
      VELA_NATS_CREDENTIALS_FILE: /credentials.json
      VELA_SAVED_IMAGES_PATH: /data/saved-images
      VELA_ASTAP: /astap/astap_cli
      VELA_STAR_CATALOG: /astap/catalog/opt/astap
      VELA_SOLVER_FIELD_HEIGHT_DEGREES: ${VELA_SOLVER_FIELD_HEIGHT_DEGREES:-}
    volumes:
      - type: bind
        source: ${VELA_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/vela}/nats/credentials.json
        target: /credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VELA_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/vela}/saved-images
        target: /data/saved-images
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VELA_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/vela}/astap
        target: /astap
        read_only: true
        bind:
          create_host_path: false

  web:
    build:
      context: .
      target: web
    image: vela-web:local
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${VELA_PORT:-5173}:8080"
