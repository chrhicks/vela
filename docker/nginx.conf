server {
  listen 8080;
  root /usr/share/nginx/html;

  # The server is not published; this is the only way to it.
  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }

  # Survey tiles and thumbnails: the server already gives up on its upstream after 15 s, so a hung one must not
  # hold a browser connection for the 120 s above. Browsers speak HTTP/2 only over TLS and this listener is plain
  # HTTP, so HTTP/2 would not lift their six-connection limit; the server pauses and caps survey fetches instead.
  location /api/survey/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 20s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
