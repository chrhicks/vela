server {
  listen 8080;
  root /usr/share/nginx/html;

  # Look the server up at request time. A plain `proxy_pass http://server:3001` resolves once when nginx loads, so
  # when the server came back on a new address (2026-11-04) every /api/ call returned 502 until nginx was reloaded.
  # 127.0.0.11 is Docker's own DNS. `valid` overrides its answer's TTL: it is how long a stale address can last.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://server:3001;

  # The server is not published; this is the only way to it.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }

  # Survey tiles and thumbnails: the server already gives up on its upstream after 15 s, so a hung one must not
  # hold a browser connection for the 120 s above. Browsers speak HTTP/2 only over TLS and this listener is plain
  # HTTP, so HTTP/2 would not lift their six-connection limit; the server pauses and caps survey fetches instead.
  location /api/survey/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 20s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
