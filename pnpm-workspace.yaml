packages:
  - apps/*
  - packages/*
  - tools/rig-session
  - tools/star-bench
  - tools/horizon-import
  - tools/rig-model

# The one Cria pin. Both packages must name the same commit; bump them together and
# regenerate the lockfile.
catalog:
  '@cria/primitives': github:chrhicks/cria#e4b6aec8bc6c8ef2d32a04ad74270e988024d5f1&path:/ts/packages/primitives
  '@cria/wire': github:chrhicks/cria#e4b6aec8bc6c8ef2d32a04ad74270e988024d5f1&path:/ts/packages/cria-wire

# Vite needs esbuild's postinstall binary. Other dependency build scripts stay blocked.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
