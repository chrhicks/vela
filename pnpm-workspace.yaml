packages:
  - apps/*
  - packages/*
  - tools/rig-session

# The one Cria pin. Both packages must name the same commit; bump them together and
# regenerate the lockfile.
catalog:
  '@cria/primitives': github:chrhicks/cria#de820644a90a4ffe22bc8d9677b0ffb93c2133ef&path:/ts/packages/primitives
  '@cria/wire': github:chrhicks/cria#de820644a90a4ffe22bc8d9677b0ffb93c2133ef&path:/ts/packages/cria-wire

# Vite needs esbuild's postinstall binary. Other dependency build scripts stay blocked.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
