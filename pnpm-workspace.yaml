packages:
  - apps/*
  - packages/*
  - tools/rig-session
  - tools/star-bench

# The one Cria pin. Both packages must name the same commit; bump them together and
# regenerate the lockfile.
catalog:
  '@cria/primitives': github:chrhicks/cria#0e77983698e11b2c55e54d48e1a1c19e0e018f88&path:/ts/packages/primitives
  '@cria/wire': github:chrhicks/cria#0e77983698e11b2c55e54d48e1a1c19e0e018f88&path:/ts/packages/cria-wire

# Vite needs esbuild's postinstall binary. Other dependency build scripts stay blocked.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
