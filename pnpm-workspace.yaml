packages:
  - apps/*
  - packages/*
  - tools/rig-session
  - tools/star-bench
  - tools/horizon-import
  - tools/rig-model

# The one Cria pin. Both packages must name the same commit; bump them together and
# regenerate the lockfile.
catalog:
  '@cria/primitives': github:chrhicks/cria#c7508b5bc618cc362807fdc0bbf02017b5364cd9&path:/ts/packages/primitives
  '@cria/wire': github:chrhicks/cria#c7508b5bc618cc362807fdc0bbf02017b5364cd9&path:/ts/packages/cria-wire

# Vite needs esbuild's postinstall binary. Other dependency build scripts stay blocked.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
