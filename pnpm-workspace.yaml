packages:
  - apps/*
  - packages/*
  - tools/rig-session

# The one Cria pin. Both packages must name the same commit; bump them together and
# regenerate the lockfile.
catalog:
  '@cria/primitives': github:chrhicks/cria#f82674d6efbc56c3f71e9533968d1f73590919fa&path:/ts/packages/primitives
  '@cria/wire': github:chrhicks/cria#f82674d6efbc56c3f71e9533968d1f73590919fa&path:/ts/packages/cria-wire

# Vite needs esbuild's postinstall binary. Other dependency build scripts stay blocked.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
