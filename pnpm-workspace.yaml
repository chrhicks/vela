packages:
  - apps/*
  - packages/*
  - tools/rig-session

# The one Cria pin. Both packages must name the same commit; bump them together and
# regenerate the lockfile.
catalog:
  '@cria/primitives': github:chrhicks/cria#c4660b85ebe20d8976c55c419f39f674171a3743&path:/ts/packages/primitives
  '@cria/wire': github:chrhicks/cria#c4660b85ebe20d8976c55c419f39f674171a3743&path:/ts/packages/cria-wire

# Vite needs esbuild's postinstall binary. Other dependency build scripts stay blocked.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
