packages:
  - apps/*
  - packages/*
  - tools/rig-session
  - tools/star-bench
  - tools/horizon-import
  - tools/rig-model

# The one Cria pin. Both packages must name the same commit; bump them together and
# regenerate the lockfile.
catalog:
  '@cria/primitives': github:chrhicks/cria#06ab310669238d2316c1b2d40421df6c4ad7f420&path:/ts/packages/primitives
  '@cria/wire': github:chrhicks/cria#06ab310669238d2316c1b2d40421df6c4ad7f420&path:/ts/packages/cria-wire

# Vite needs esbuild's postinstall binary. Other dependency build scripts stay blocked.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
