packages:
  - apps/*
  - packages/*
  - tools/rig-session
  - tools/star-bench
  - tools/horizon-import
  - tools/rig-model

# The one Cria pin. Both packages must name the same commit; bump them together and
# regenerate the lockfile.
catalog:
  '@cria/primitives': github:chrhicks/cria#fe43451fbff9c34148152a22daaba7961418ec22&path:/ts/packages/primitives
  '@cria/wire': github:chrhicks/cria#fe43451fbff9c34148152a22daaba7961418ec22&path:/ts/packages/cria-wire

# Vite needs esbuild's postinstall binary. Other dependency build scripts stay blocked.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
