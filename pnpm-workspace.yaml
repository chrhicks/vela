packages:
  - apps/*
  - packages/*
  - tools/rig-session

# The one Cria pin. Both packages must name the same commit; bump them together and
# regenerate the lockfile.
catalog:
  '@cria/primitives': github:chrhicks/cria#9bbffaed874dcdcfe6407fe80afe18c3d23e1870&path:/ts/packages/primitives
  '@cria/wire': github:chrhicks/cria#9bbffaed874dcdcfe6407fe80afe18c3d23e1870&path:/ts/packages/cria-wire

# Vite needs esbuild's postinstall binary. Other dependency build scripts stay blocked.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
