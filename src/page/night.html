<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vela</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1b1f24; --muted: #6a737d; --line: #d8dee4; --card: #f6f8fa; --warn: #9a6700; --bad: #b42318; --good: #1a7f37; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --card: #161b22; --warn: #d29922; --bad: #f85149; --good: #3fb950; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 20px; }
  .rig { color: var(--muted); font-size: 14px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--card); }
  section h2 { margin: 0 0 4px; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
  .link { font-size: 13px; font-weight: normal; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .stale { color: var(--warn); }
  .unknown { color: var(--muted); }
  .current.ok { color: var(--good); }
  #stops { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-bottom: 4px; }
  #mountbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  #status { flex: 1 1 240px; font-weight: 600; }
  #status.warn { color: var(--warn); }
  #status.bad { color: var(--bad); }
  #mountbar:has(#status.warn) { border-color: var(--warn); }
  #mountbar:has(#status.bad) { border-color: var(--bad); }
  #mount-stop { font: inherit; font-weight: 600; padding: 8px 20px; border: 0; border-radius: 6px; background: var(--bad); color: #fff; cursor: pointer; }
  #runbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; margin-bottom: 12px; border: 1px solid var(--good); border-radius: 8px; background: var(--card); }
  #runbar[hidden] { display: none; }
  #runbar .progress { flex: 1 1 240px; font-variant-numeric: tabular-nums; }
  #stop { font: inherit; font-weight: 600; padding: 8px 20px; border: 0; border-radius: 6px; background: var(--bad); color: #fff; cursor: pointer; }
  #capture { margin-bottom: 12px; }
  #capture form { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; }
  #capture label { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--muted); }
  #capture input, #capture select { font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  #capture input:disabled { opacity: 0.5; }
  #capture button[type=submit] { grid-column: 1 / -1; font: inherit; font-weight: 600; padding: 8px 20px; border: 0; border-radius: 6px; background: var(--good); color: #fff; cursor: pointer; justify-self: start; }
  #capture button[disabled] { opacity: 0.5; cursor: default; }
  #capture-error { color: var(--bad); margin: 8px 0 0; }
  #last-run { margin: 8px 0 0; color: var(--muted); }
  #last-run.bad { color: var(--bad); }
  #last-run.warn { color: var(--warn); }
  #focusbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; margin-bottom: 12px; border: 1px solid var(--warn); border-radius: 8px; background: var(--card); }
  #focusbar[hidden] { display: none; }
  #focusbar .progress { flex: 1 1 240px; font-variant-numeric: tabular-nums; }
  #focus-stop { font: inherit; font-weight: 600; padding: 8px 20px; border: 0; border-radius: 6px; background: var(--bad); color: #fff; cursor: pointer; }
  #prepare { margin-bottom: 12px; }
  #prepare .group { margin-bottom: 12px; }
  #pointing { margin-bottom: 12px; }
  #pointing .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  #pointing input[type=search] { flex: 1 1 240px; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  #pointing button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
  #pointing button[disabled] { opacity: 0.5; cursor: default; }
  #pointing ul { list-style: none; margin: 0 0 8px; padding: 0; }
  #pointing li button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
  #pointing h3 { margin: 0 0 6px; font-size: 15px; }
  #pointing-error { color: var(--bad); }
  #goto-status.bad { color: var(--bad); }
  #goto-status.warn { color: var(--warn); }
  #prepare h3 { margin: 0 0 6px; font-size: 15px; }
  #prepare .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
  #prepare .row > span { min-width: 80px; }
  #prepare input[type=number] { width: 110px; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  #prepare button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
  #prepare button[disabled], #prepare input:disabled { opacity: 0.5; cursor: default; }
  #prepare-error { color: var(--bad); margin: 8px 0 0; }
  #frames { margin-top: 12px; }
  #frames img { display: block; max-width: 100%; height: auto; border-radius: 6px; margin-bottom: 8px; }
  #frames table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #frames th, #frames td { text-align: left; padding: 2px 8px 2px 0; }
  #frames td.size { text-align: right; }
  #frames a { color: inherit; }
</style>
</head>
<body>
<header><h1>Vela</h1><span class="rig" id="rig"></span></header>
<div id="stops">
<div id="mountbar">
  <span id="status" role="status">Reading the rig from the stream</span>
  <button type="button" id="mount-stop">Stop mount</button>
</div>
<div id="runbar" hidden>
  <span class="progress" id="progress"></span>
  <button type="button" id="stop">Stop</button>
</div>
<div id="focusbar" hidden>
  <span class="progress" id="focus-progress"></span>
  <button type="button" id="focus-stop">Stop focuser</button>
</div>
</div>
<main id="devices"></main>
<section id="prepare">
  <h2><span>Preparation</span></h2>
  <div class="group" id="focuser-controls">
    <h3>Focuser</h3>
    <div class="row">
      <span id="focus-where" class="unknown"></span>
    </div>
    <div class="row">
      <input type="number" step="1" id="focus-target" aria-label="Target position">
      <button type="button" id="focus-move">Move to position</button>
      <button type="button" id="focus-in"></button>
      <button type="button" id="focus-out"></button>
    </div>
  </div>
  <div class="group" id="dew-controls">
    <h3>Dew heaters</h3>
    <div class="row" id="dew-auto-row">
      <span>Automatic</span>
      <button type="button" id="dew-auto-on">On</button>
      <button type="button" id="dew-auto-off">Off</button>
      <span id="dew-auto-state" class="unknown"></span>
    </div>
    <div id="dew-channels"></div>
    <p class="unknown" id="dew-none">The power box has not reported its dew outputs</p>
  </div>
  <p id="prepare-error" hidden></p>
</section>
<section id="pointing">
  <h2><span>Pointing</span></h2>
  <p class="warn">Every motion needs Chris at the rig.</p>
  <div class="row">
    <span id="mount-state" class="unknown"></span>
    <button type="button" id="mount-unpark">Unpark</button>
    <button type="button" id="mount-home">Home</button>
    <button type="button" id="tracking-on">Tracking on</button>
    <button type="button" id="tracking-off">Tracking off</button>
  </div>
  <div class="row">
    <input type="search" id="target-search" placeholder="Target: M 31, NGC 7000, Orion" aria-label="Search the catalog">
  </div>
  <ul id="target-results"></ul>
  <div id="target-panel" hidden>
    <h3 id="target-title"></h3>
    <dl id="target-facts"></dl>
    <div class="row"><button type="button" id="goto">Go to target</button></div>
  </div>
  <p id="goto-status" hidden></p>
  <p id="pointing-error" hidden></p>
</section>
<section id="capture">
  <h2><span>Capture</span></h2>
  <form id="capture-form">
    <label>Object<input name="object" required value=""></label>
    <label>Frame type<select name="frameType"><option>light</option><option>dark</option><option>flat</option><option>bias</option></select></label>
    <label>Exposure (s)<input name="exposureSeconds" type="number" min="0" step="any" required value="120"></label>
    <label>Frames<input name="count" type="number" min="1" step="1" required value="10"></label>
    <label>Gain<input name="gain" type="number" min="0" step="any" required value="100"></label>
    <label>Offset<input name="offset" type="number" min="0" step="any" required value="50"></label>
    <label>Cooler<select name="cooler"><option value="keep">leave as it is</option><option value="on">on</option><option value="off">off</option></select></label>
    <label>Setpoint (&deg;C)<input name="setpoint" type="number" step="any" value="-10" disabled></label>
    <button type="submit" id="start">Start</button>
  </form>
  <p id="capture-error" hidden></p>
  <p id="last-run" hidden></p>
</section>
<section id="frames" hidden>
  <h2><span id="frames-title"></span></h2>
  <p class="unknown" id="preview-note"></p>
  <img id="preview" alt="Latest frame" hidden>
  <table><tbody id="frame-rows"></tbody></table>
</section>
<script>
const statusLine = document.getElementById('status')
const statusParts = { night: undefined, run: undefined, goto: undefined, lost: false }

const gotoActivity = { sending: 'Sending a goto to ', sent: 'Goto sent to ', slewing: 'Slewing to ' }

function showStatus() {
  const { night, run, goto, lost } = statusParts
  let problem = ''
  let level = ''
  if (lost) [problem, level] = ['Lost the connection to Vela: values on this page are old', 'bad']
  else if (night === undefined || night.phase === 'loading') problem = 'Reading the rig from the stream'
  else if (night.phase === 'no-connection') [problem, level] = ['The stream holds no rig connection: nothing is known', 'bad']
  else if (night.phase === 'silent') [problem, level] = ['Rig silent for ' + night.rig.silentSeconds + ' s: every value is stale', 'warn']
  else {
    const down = night.devices.filter(device => device.connection.text !== 'connected' && device.connection.status !== 'unknown')
    if (down.length > 0) [problem, level] = [down.map(device => device.title + ' ' + device.connection.text).join(', '), 'bad']
  }
  const activities = []
  if (night?.phase === 'live' && !lost) {
    if (run !== undefined) activities.push('Capturing ' + run.object)
    if (goto !== undefined && gotoActivity[goto.phase] !== undefined) activities.push(gotoActivity[goto.phase] + goto.name)
    if (night.prepare?.focuser.moving) activities.push('Focuser moving')
  }
  const activity = activities.length > 0 ? activities.join(', ') : night?.phase === 'live' && !lost ? 'Idle' : ''
  const allWell = level === '' && problem === '' && night?.phase === 'live' && !lost
  statusLine.textContent = [allWell ? 'All connected' : problem, activity].filter(part => part !== '').join('. ')
  statusLine.className = level
}
const rig = document.getElementById('rig')
const devices = document.getElementById('devices')

function clock(ms) {
  return new Date(ms).toLocaleString([], { hour12: false })
}

function ago(from, now) {
  const seconds = Math.max(0, Math.round((now - from) / 1000))
  if (seconds < 90) return seconds + ' s ago'
  if (seconds < 5400) return Math.round(seconds / 60) + ' min ago'
  return Math.round(seconds / 3600) + ' h ago'
}

function element(tag, className, text) {
  const node = document.createElement(tag)
  if (className) node.className = className
  if (text !== undefined) node.textContent = text
  return node
}

function show(night) {
  statusParts.night = night
  showStatus()
  rig.textContent = night.rig.connectedAt === undefined
    ? 'no rig connection'
    : 'rig connected ' + clock(night.rig.connectedAt) + ' (' + ago(night.rig.connectedAt, night.at) + '), connection ' + (night.rig.connection ?? '?') + (night.rig.indiserver === 'closed' ? ', indiserver lost' : '')

  devices.replaceChildren(...night.devices.map(device => {
    const card = element('section')
    const title = element('h2')
    title.append(element('span', '', device.title), element('span', 'link ' + device.connection.status, device.connection.text))
    const list = element('dl')
    for (const field of device.fields) {
      const value = element('dd', field.status, field.status === 'stale' ? field.text + ' (stale)' : field.text)
      if (field.changedAt !== undefined) value.title = 'changed ' + clock(field.changedAt)
      list.append(element('dt', '', field.label), value)
    }
    card.append(title, list)
    return card
  }))
}

const framesSection = document.getElementById('frames')
const framesTitle = document.getElementById('frames-title')
const previewImage = document.getElementById('preview')
const previewNote = document.getElementById('preview-note')
const frameRows = document.getElementById('frame-rows')
let previewShown = ''

function previewUrl(night, file) {
  return '/frames/' + night + '/' + file + '.png'
}

function showFrames(list) {
  framesSection.hidden = false
  framesTitle.textContent = 'Frames kept on the night of ' + list.night + ' (' + list.frames.length + ')'
  const latest = list.frames[0]
  if (latest === undefined) {
    previewImage.hidden = true
    previewNote.textContent = 'No frame kept yet tonight'
    previewShown = ''
  } else if (previewShown !== latest.file) {
    previewShown = latest.file
    previewNote.textContent = 'Making the preview of ' + latest.file
    previewImage.hidden = true
    previewImage.onload = () => {
      previewNote.textContent = 'Latest: ' + latest.file + ', kept ' + clock(Date.parse(latest.keptAt))
      previewImage.hidden = false
    }
    previewImage.onerror = () => {
      previewNote.textContent = 'No preview for ' + latest.file
    }
    previewImage.src = previewUrl(list.night, latest.file)
  }
  frameRows.replaceChildren(...list.frames.map(frame => {
    const row = element('tr')
    const link = element('a', '', frame.file)
    link.href = previewUrl(list.night, frame.file)
    link.target = '_blank'
    const name = element('td')
    name.append(link)
    row.append(name, element('td', '', clock(Date.parse(frame.keptAt))), element('td', 'size', (frame.bytes / 1048576).toFixed(1) + ' MB'))
    return row
  }))
}

const runbar = document.getElementById('runbar')
const progress = document.getElementById('progress')
const stopButton = document.getElementById('stop')
const captureForm = document.getElementById('capture-form')
const startButton = document.getElementById('start')
const captureError = document.getElementById('capture-error')
const lastRun = document.getElementById('last-run')

captureForm.elements.cooler.addEventListener('change', () => {
  captureForm.elements.setpoint.disabled = captureForm.elements.cooler.value !== 'on'
})

function showError(text) {
  captureError.hidden = text === ''
  captureError.textContent = text
}

async function post(path, body) {
  const response = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
  return { ok: response.ok, body: await response.json() }
}

captureForm.addEventListener('submit', async event => {
  event.preventDefault()
  const data = new FormData(captureForm)
  const request = {
    object: data.get('object'),
    frameType: data.get('frameType'),
    exposureSeconds: Number(data.get('exposureSeconds')),
    count: Number(data.get('count')),
    gain: Number(data.get('gain')),
    offset: Number(data.get('offset')),
    cooler: data.get('cooler'),
  }
  if (request.cooler === 'on') request.setpoint = Number(data.get('setpoint'))
  showError('')
  try {
    const result = await post('/capture', request)
    if (!result.ok) showError(result.body.error)
  } catch (error) {
    showError('Could not reach Vela: ' + error)
  }
})

stopButton.addEventListener('click', async () => {
  stopButton.disabled = true
  try {
    await post('/capture/stop', {})
  } catch (error) {
    showError('Stop did not reach Vela: ' + error)
  }
  stopButton.disabled = false
})

const endings = {
  done: ['finished', ''],
  stopped: ['stopped', 'warn'],
  failures: ['stopped after failures', 'bad'],
  interrupted: ['interrupted', 'bad'],
  refused: ['stopped: a command was refused', 'bad'],
  unknown: ['stopped: a command could not be confirmed', 'bad'],
}

let captureRunning = false

function enableCapture() {
  for (const control of captureForm.elements) control.disabled = captureRunning || !lastLive || (control.name === 'setpoint' && captureForm.elements.cooler.value !== 'on')
}

function asOf(node, text, live) {
  node.textContent = live ? text : text + ' (stale)'
  node.className = live ? 'unknown' : 'stale'
}

function showCapture(view) {
  const run = view.run
  statusParts.run = run
  showStatus()
  runbar.hidden = run === undefined
  captureRunning = run !== undefined
  enableCapture()
  if (run !== undefined) {
    const phase = run.phase === 'exposing' ? (run.secondsLeft === undefined ? 'starting the exposure' : 'exposing, ' + run.secondsLeft + ' s left') : run.phase === 'preparing' ? 'setting the camera' : 'ending'
    progress.textContent = run.object + ' ' + run.frameType + ': frame ' + run.frame + ' of ' + run.count + ', ' + phase + (run.failed > 0 ? ' (' + run.failed + ' failed)' : '')
  }
  const last = view.last
  lastRun.hidden = last === undefined
  if (last !== undefined) {
    const [text, level] = endings[last.reason] ?? [last.reason, 'bad']
    lastRun.className = level
    lastRun.textContent = 'Last run ' + last.run + ' ' + text + ' at ' + clock(last.at) + ': ' + last.counted + ' frames kept' + (last.failed > 0 ? ', ' + last.failed + ' failed' : '') + (last.reason === 'done' ? '' : '. ' + last.detail)
  }
}

const focusbar = document.getElementById('focusbar')
const focusProgress = document.getElementById('focus-progress')
const focusWhere = document.getElementById('focus-where')
const focusTarget = document.getElementById('focus-target')
const focusButtons = ['focus-move', 'focus-in', 'focus-out'].map(id => document.getElementById(id))
const [focusMove, focusIn, focusOut] = focusButtons
const dewAutoState = document.getElementById('dew-auto-state')
const dewAutoButtons = [document.getElementById('dew-auto-on'), document.getElementById('dew-auto-off')]
const dewChannels = document.getElementById('dew-channels')
const dewNone = document.getElementById('dew-none')
const prepareError = document.getElementById('prepare-error')
const dewRows = new Map()
let prepareLive = false

async function prepareAction(request) {
  prepareError.hidden = true
  try {
    const result = await post('/prepare', request)
    if (!result.ok) {
      prepareError.hidden = false
      prepareError.textContent = result.body.error
    }
  } catch (error) {
    prepareError.hidden = false
    prepareError.textContent = 'Could not reach Vela: ' + error
  }
}

document.getElementById('focus-stop').addEventListener('click', () => prepareAction({ action: 'focuser-stop' }))
focusMove.addEventListener('click', () => prepareAction({ action: 'focuser-move', position: Number(focusTarget.value) }))
focusIn.addEventListener('click', () => prepareAction({ action: 'focuser-nudge', direction: 'in' }))
focusOut.addEventListener('click', () => prepareAction({ action: 'focuser-nudge', direction: 'out' }))
dewAutoButtons[0].addEventListener('click', () => prepareAction({ action: 'dew-auto', on: true }))
dewAutoButtons[1].addEventListener('click', () => prepareAction({ action: 'dew-auto', on: false }))

function dewRow(channel) {
  const row = element('div', 'row')
  const name = element('span', '', channel.label)
  const on = element('button', '', 'On')
  const off = element('button', '', 'Off')
  const state = element('span', 'unknown')
  const duty = element('input')
  duty.type = 'number'
  duty.step = 'any'
  duty.setAttribute('aria-label', channel.label + ' duty (%)')
  const set = element('button', '', 'Set duty')
  on.addEventListener('click', () => prepareAction({ action: 'dew-channel', channel: channel.id, on: true }))
  off.addEventListener('click', () => prepareAction({ action: 'dew-channel', channel: channel.id, on: false }))
  set.addEventListener('click', () => prepareAction({ action: 'dew-duty', channel: channel.id, percent: Number(duty.value) }))
  row.append(name, on, off, state, duty, set)
  return { row, state, duty, buttons: [on, off, set] }
}

function showPrepare(night) {
  const { focuser, dew } = night.prepare
  prepareLive = night.phase === 'live'
  focusbar.hidden = !focuser.moving
  if (focuser.moving) focusProgress.textContent = 'Focuser moving' + (focuser.position === undefined ? '' : ', at ' + focuser.position + ' steps')
  const range = focuser.min === undefined ? 'limits not on the stream' : 'limits ' + focuser.min + ' to ' + focuser.max
  asOf(focusWhere, !focuser.known ? 'Focuser not on the stream' : (focuser.position === undefined ? 'position unknown' : focuser.position + ' steps') + ', ' + range + (focuser.moving ? ', moving' : ''), prepareLive || !focuser.known)
  if (focuser.min !== undefined) {
    focusTarget.min = focuser.min
    focusTarget.max = focuser.max
  }
  focusIn.textContent = 'In ' + focuser.nudgeSteps
  focusOut.textContent = 'Out ' + focuser.nudgeSteps
  for (const button of focusButtons) button.disabled = !prepareLive || !focuser.known
  focusTarget.disabled = !prepareLive || !focuser.known

  dewNone.hidden = dew.channels.length > 0
  asOf(dewAutoState, dew.auto === undefined ? '' : dew.auto ? 'on' : 'off', prepareLive || dew.auto === undefined)
  for (const button of dewAutoButtons) button.disabled = !prepareLive || dew.auto === undefined
  for (const channel of dew.channels) {
    let parts = dewRows.get(channel.id)
    if (parts === undefined) {
      parts = dewRow(channel)
      dewRows.set(channel.id, parts)
      dewChannels.append(parts.row)
    }
    asOf(parts.state, (channel.on === undefined ? 'unknown' : channel.on ? 'on' : 'off') + (channel.duty === undefined ? '' : ', ' + channel.duty + ' %'), prepareLive || channel.on === undefined)
    if (channel.min !== undefined) {
      parts.duty.min = channel.min
      parts.duty.max = channel.max
    }
    for (const button of parts.buttons) button.disabled = !prepareLive
    parts.duty.disabled = !prepareLive
  }
}

const mountState = document.getElementById('mount-state')
const searchBox = document.getElementById('target-search')
const targetResults = document.getElementById('target-results')
const targetPanel = document.getElementById('target-panel')
const targetTitle = document.getElementById('target-title')
const targetFacts = document.getElementById('target-facts')
const gotoButton = document.getElementById('goto')
const gotoStatus = document.getElementById('goto-status')
const pointingError = document.getElementById('pointing-error')
const pointingButtons = ['mount-unpark', 'mount-home', 'tracking-on', 'tracking-off'].map(id => document.getElementById(id))
let chosen
let chosenId = ''
let currentMeridian = ''

async function pointingAction(request) {
  pointingError.hidden = true
  try {
    const result = await post('/pointing', request)
    if (!result.ok) {
      pointingError.hidden = false
      pointingError.textContent = result.body.error
    }
  } catch (error) {
    pointingError.hidden = false
    pointingError.textContent = 'Could not reach Vela: ' + error
  }
}

document.getElementById('mount-stop').addEventListener('click', () => pointingAction({ action: 'stop' }))
document.getElementById('mount-unpark').addEventListener('click', () => pointingAction({ action: 'unpark' }))
document.getElementById('mount-home').addEventListener('click', () => pointingAction({ action: 'home' }))
document.getElementById('tracking-on').addEventListener('click', () => pointingAction({ action: 'tracking', on: true }))
document.getElementById('tracking-off').addEventListener('click', () => pointingAction({ action: 'tracking', on: false }))
gotoButton.addEventListener('click', () => pointingAction({ action: 'goto', id: chosenId }))

function duration(seconds) {
  const total = Math.round(Math.abs(seconds) / 60)
  const hoursPart = Math.floor(total / 60)
  const minutes = total % 60
  return hoursPart === 0 ? minutes + ' min' : hoursPart + ' h ' + String(minutes).padStart(2, '0') + ' min'
}

function hms(hoursValue) {
  const total = Math.round(((hoursValue % 24) + 24) % 24 * 3600) % 86400
  return String(Math.floor(total / 3600)).padStart(2, '0') + 'h ' + String(Math.floor(total % 3600 / 60)).padStart(2, '0') + 'm ' + String(total % 60).padStart(2, '0') + 's'
}

function dms(degrees) {
  const total = Math.round(Math.abs(degrees) * 3600)
  return (degrees < 0 ? '-' : '+') + String(Math.floor(total / 3600)).padStart(2, '0') + '° ' + String(Math.floor(total % 3600 / 60)).padStart(2, '0') + '′ ' + String(total % 60).padStart(2, '0') + '″'
}

function showTarget() {
  if (chosen === undefined) return
  const { target, meridianLimitAt } = chosen
  targetPanel.hidden = false
  targetTitle.textContent = (target.commonName ? target.commonName + ' (' + target.name + ')' : target.name) + ', ' + target.type + (target.constellation ? ' in ' + target.constellation : '')
  const meridian = meridianLimitAt === undefined ? 'unknown' : meridianLimitAt >= Date.now() ? 'in ' + duration((meridianLimitAt - Date.now()) / 1000) : 'reached, ' + duration((Date.now() - meridianLimitAt) / 1000) + ' past'
  const rows = [
    ['J2000', hms(target.raJ2000Hours) + '  ' + dms(target.decJ2000Degrees)],
    ['Of date (sent to the mount)', hms(target.raHours) + '  ' + dms(target.decDegrees)],
    ['Meridian limit, this target', meridian],
    ['Meridian limit, where the mount points now', currentMeridian],
  ]
  targetFacts.replaceChildren(...rows.flatMap(([label, text]) => [element('dt', '', label), element('dd', '', text)]))
}

async function choose(id) {
  chosenId = id
  const response = await fetch('/target?id=' + encodeURIComponent(id))
  const result = await response.json()
  if (!result.ok) {
    chosen = undefined
    targetPanel.hidden = true
    pointingError.hidden = false
    pointingError.textContent = result.reason
    return
  }
  pointingError.hidden = true
  chosen = result
  showTarget()
}

searchBox.addEventListener('input', async () => {
  const text = searchBox.value.trim()
  if (text === '') {
    targetResults.replaceChildren()
    return
  }
  const response = await fetch('/targets?q=' + encodeURIComponent(text))
  const list = await response.json()
  if (searchBox.value.trim() !== text) return
  targetResults.replaceChildren(...list.map(found => {
    const item = element('li')
    const button = element('button', '', found.name + (found.commonName ? ' ' + found.commonName : '') + ' (' + found.type + ')')
    button.type = 'button'
    button.addEventListener('click', () => choose(found.id))
    item.append(button)
    return item
  }))
})

const gotoPhases = {
  sending: ['sending the goto', ''],
  sent: ['goto written, waiting for the mount to start slewing', ''],
  slewing: ['slewing', ''],
  arrived: ['arrived', ''],
  failed: ['failed', 'bad'],
  stopped: ['stopped', 'warn'],
}

function showPointing(view, live) {
  asOf(mountState, (view.parked === undefined ? 'park state unknown' : view.parked ? 'parked' : 'unparked') + ', tracking ' + (view.tracking === undefined ? 'unknown' : view.tracking ? 'on' : 'off'), live)
  for (const button of pointingButtons) button.disabled = !live
  gotoButton.disabled = !live || chosen === undefined
  const goto = view.goto
  statusParts.goto = goto
  showStatus()
  gotoStatus.hidden = goto === undefined
  if (goto !== undefined) {
    const [text, level] = gotoPhases[goto.phase]
    gotoStatus.className = level
    gotoStatus.textContent = 'Target ' + goto.name + ' (' + hms(goto.raHours) + ' ' + dms(goto.decDegrees) + ' of date), sent ' + clock(goto.sentAt) + ': ' + text +
      (goto.arrivedAt === undefined ? '' : ' at ' + clock(goto.arrivedAt)) +
      (goto.separationDegrees === undefined ? '' : ', mount ' + (goto.separationDegrees * 60).toFixed(1) + '′ from it') +
      (goto.detail === undefined ? '' : '. ' + goto.detail)
  }
}

let lastPointing
let lastLive = false

const events = new EventSource('/events')
events.addEventListener('pointing', event => {
  lastPointing = JSON.parse(event.data)
  showPointing(lastPointing, lastLive)
  showTarget()
})
events.addEventListener('capture', event => showCapture(JSON.parse(event.data)))
events.addEventListener('night', event => {
  const night = JSON.parse(event.data)
  show(night)
  showPrepare(night)
  lastLive = night.phase === 'live'
  enableCapture()
  currentMeridian = night.devices.find(device => device.id === 'mount').fields.find(field => field.label === 'Meridian limit').text
  if (lastPointing !== undefined) showPointing(lastPointing, lastLive)
})
events.addEventListener('frames', event => showFrames(JSON.parse(event.data)))
events.onerror = () => {
  statusParts.lost = true
  showStatus()
}
events.onopen = () => {
  statusParts.lost = false
  showStatus()
}
</script>
</body>
